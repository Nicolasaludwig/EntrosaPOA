<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EntrosaPOA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container Principal (Tela Inteira) -->
    <div class="app-container">
        
        <!-- Cabeçalho -->
        <header class="header">
            <div class="header-left">
                <div class="logo-circle skeleton"></div>
                <div class="brand-name skeleton">EntrosaPOA</div>
                <nav class="nav-links">
                    <a href="#" class="skeleton">Inicio</a>
                    <a href="#" class="skeleton">Eventos</a>
                    <a href="#" class="skeleton">Sobre</a>
                </nav>
            </div>
            
            <div class="search-bar skeleton">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                </svg>
                <input type="text" placeholder="Buscar..." class="search-input">
            </div>

            <div class="header-right">
                <span class="account-text skeleton">Conta</span>
                <div class="account-circle skeleton"></div>
            </div>
        </header>

        <!-- Banner Hero -->
        <section class="hero-section skeleton"></section>

        <!-- Conteúdo Principal Inferior -->
        <main class="main-content">
            
            <!-- Coluna Esquerda -->
            <aside class="sidebar skeleton"></aside>

            <!-- Coluna Direita (Feed) -->
            <section class="feed-area">
                
                <button class="filter-btn skeleton">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-down" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708"/>
                    </svg>
                    Filtros
                </button>

                <!-- Cards de Eventos -->
                <div class="card">
                    <div class="card-image-placeholder skeleton"></div>
                    <div class="card-content-placeholder skeleton"></div>
                </div>
                
                <div class="card">
                    <div class="card-image-placeholder skeleton"></div>
                    <div class="card-content-placeholder skeleton"></div>
                </div>

                <div class="card">
                    <div class="card-image-placeholder skeleton"></div>
                    <div class="card-content-placeholder skeleton"></div>
                </div>

            </section>
        </main>
    </div>

    <!-- Script de Animações -->
    <script src="animacoes.js"></script>
</body>
</html>
